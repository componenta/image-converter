name: Check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: gd, exif
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: find src tests benchmarks -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer check
      - name: Repeated processing memory smoke
        run: php benchmarks/worker-memory.php
      - name: Isolate native codec memory growth
        if: matrix.php == '8.4'
        run: |
          set -euo pipefail
          for case in jpeg:png png:jpeg png:webp webp:avif avif:png; do
            php benchmarks/worker-codec-probe.php library "${case%:*}" "${case#*:}"
            php benchmarks/worker-codec-probe.php native "${case%:*}" "${case#*:}"
          done
          for mode in detect header decode encode; do
            php benchmarks/worker-codec-probe.php "$mode" avif avif
          done
      - name: PHPBench smoke
        if: matrix.php == '8.4'
        run: composer bench -- --variant=jpeg-webp-1000x1000-bytes --iterations=1 --revs=1
